# Render blueprint for the public deploy.
# 1. Push this repo to GitHub.
# 2. In Render: New > Blueprint, point at the repo (it reads this file).
# Render provides HTTPS, $PORT, and a health check automatically. No API keys:
# the app is pure Wikidata/SPARQL, so there are no secrets to set.
services:
  - type: web
    name: artwork-of-the-day
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: starter            # ~$7/mo, always-on. Use "free" to try (sleeps when idle).
    healthCheckPath: /healthz   # lightweight, rate-limit-exempt liveness probe
    autoDeploy: true
    envVars:
      - key: AOTD_CONTACT
        value: https://metahistorybook.com
      # Rate limits and cache cap use sensible defaults; override here if needed
      # (AOTD_RATELIMIT_DEFAULT, AOTD_CACHE_MAX).
