name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax-check every module
        run: git ls-files '*.py' | xargs python -m py_compile

      - name: Import smoke-test the app
        run: python -c "import app, serve, enrichment, sparql_library, wikidata_facts, wikibase_rest"

      - name: Run tests
        run: pytest -q
