name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy

      - name: Import smoke-test the app
        run: python -c "import app, serve, enrichment, sparql_library, wikidata_facts, wikibase_rest"

      - name: Run tests with coverage
        run: pytest -q --cov=wikidata_facts --cov=wikibase_rest --cov=article_writer --cov=sparql_library --cov-report=term-missing
