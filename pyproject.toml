[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored reference repos and generated schemas are not our code to lint.
extend-exclude = ["reference", "fastapidocker", "fastapiollamadocker", "linked_art_schema", ".venv"]

[tool.ruff.lint]
# pycodestyle/pyflakes + import sorting (I), pyupgrade (UP), bugbear (B),
# comprehensions (C4) — a solid, non-fussy bar.
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
  "E741",   # ambiguous names (l/I) — used intentionally in a few list comprehensions
  "B008",   # function calls in defaults (we use them for lazy task thunks)
  "UP031",  # %-formatting — idiomatic and readable for our SPARQL query templates
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Pragmatic: type-check the cleanly-typed modules; don't follow into the
# (intentionally untyped) rest of the codebase.
files = ["wikibase_rest.py", "wikidata_facts.py"]
follow_imports = "silent"
