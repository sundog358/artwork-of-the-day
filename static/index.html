  <body>
    <div class="container">
      <header class="site-header">
        <div class="brand">
          <img src="/static/8sprocket.jpg" alt="Meta History Book logo" class="site-logo" />
          <div class="brand-text">
            <span class="brand-eyebrow">Meta History Book</span>
            <h1>Artwork of the Day</h1>
            <p class="brand-tagline">Art in history, and history in art — explore meta art history.</p>
          </div>
        </div>
        <div class="controls" id="controls">
          <button id="btn-back" class="ctrl-btn ghost" style="display: none">&larr; Back</button>
          <button id="btn-surprise" class="ctrl-btn" title="Jump to a random painting">🎲 Surprise me</button>
          <label class="ctrl-date" title="Browse paintings for any calendar date">
            <span>📅 Date</span>
            <input type="date" id="date-pick" />
          </label>
          <button id="btn-today" class="ctrl-btn ghost" title="Back to today's pick">Today</button>
          <button id="btn-theme" class="ctrl-btn ghost" title="Toggle gallery (dark) mode" aria-label="Toggle dark mode">🌙</button>
        </div>
      </header>
      <div id="occasion" class="occasion" style="display: none"></div>
      <div id="content">
        <div class="loading-container">
          <div class="loading-spinner"></div>
          <div class="loading-text">Loading Artwork of the Day</div>
          <div class="loading-progress">
            <div class="loading-bar" id="loadingBar"></div>

              >Wikimedia Commons</a

    <script>
      const ICONS = { birthday: "🎂", random: "🗓️" };

      const state = {
        occasion: "random",
        today: "",
        items: [], // [{artwork_id, creator_id, image, birthYear}]
        index: 0,
        current: null, // the item currently shown (a day item, or an explored one)
        stack: [], // explore history (items), for the Back button
        cache: {}, // artwork_id -> { artwork, artist }
        articleCache: {}, // "<artwork_id>:about" -> article payload
        enrichCache: {}, // artwork_id -> enrichment payload
      };

      function esc(s) {
        return (s == null ? "" : String(s)).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c])
        );
      }

      // Turn a Commons FilePath thumbnail URL into its File: description page,
      // which carries the specific image's author, license, and reuse terms.
      function commonsFilePage(url) {
        const m = (url || "").match(/Special:FilePath\/([^?]+)/);
        return m ? "https://commons.wikimedia.org/wiki/File:" + m[1] : "";
      }

      function updateLoadingProgress(progress, status) {
        const bar = document.getElementById("loadingBar");
        const statusEl = document.getElementById("loadingStatus");
        if (bar && statusEl) {
          bar.style.width = `${progress}%`;
          statusEl.textContent = status;
        }
      }

      function showLoading(message) {
        const occasionEl = document.getElementById("occasion");
        if (occasionEl) occasionEl.style.display = "none";
        document.getElementById("content").innerHTML = `
          <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading Artwork of the Day</div>
            <div class="loading-progress">
              <div class="loading-bar" id="loadingBar"></div>
            </div>
            <div class="loading-status" id="loadingStatus">${esc(message)}</div>
          </div>`;
      }

      function showError(message) {
        document.getElementById("content").innerHTML = `
          <div class="error">
            <i class="fas fa-exclamation-circle"></i>
            <div>Error loading artwork:</div>
            <div style="margin-top: 10px;">${esc(message)}</div>
            <button onclick="fetchArtwork()" class="btn btn-danger mt-3">
              <i class="fas fa-redo"></i> Try Again
            </button>
          </div>`;
      }

      // ---- Initial load: fetch the list of the day's artworks ----------------
      async function fetchArtwork() {
        try {
          showLoading("Searching for artwork...");
          updateLoadingProgress(30, "Searching for artwork...");

          const response = await fetch("/artwork-of-the-day");
          updateLoadingProgress(60, "Connected to database...");
          const data = await response.json();

          if (!response.ok || data.status === "error") {
            throw new Error(data.message || `HTTP error ${response.status}`);
          }

          state.occasion = data.occasion;
          state.today = data.today;
          state.items = data.items || [];
          state.index = 0;
          state.stack = [];

          if (!state.items.length) throw new Error("No artwork found for today");

          state.current = state.items[0];
          updateLoadingProgress(100, "Complete!");
          updateControls();
          showCurrent();
        } catch (error) {
          console.error("Error:", error);
          showError(error.message);
        }
      }

      // ---- Fetch (and cache) details for a single artwork --------------------
      async function loadDetails(item) {
        if (state.cache[item.artwork_id]) return state.cache[item.artwork_id];
        const url =
          `/artwork-details?artwork=${encodeURIComponent(item.artwork_id)}` +
          `&artist=${encodeURIComponent(item.creator_id)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok || data.status === "error") {
          throw new Error(data.message || "Could not load details");
        }
        state.cache[item.artwork_id] = data;
        return data;
      }

      // ---- Article: assembled directly from Wikidata (no AI) -----------------
      async function fetchArticle(item) {
        const ck = item.artwork_id + ":about";
        if (state.articleCache[ck]) return state.articleCache[ck];
        const url =
          `/artwork-article?artwork=${encodeURIComponent(item.artwork_id)}` +
          `&artist=${encodeURIComponent(item.creator_id)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok || data.status === "error") throw new Error(data.message || "no article");
        state.articleCache[ck] = data;
        return data;
      }

      async function loadArticle(item) {
        const el = document.getElementById("aotd-about");
        if (!el) return;
        // Cached per artwork, so each piece is assembled at most once.
        el.innerHTML =
          `<div class="mini-loading"><div class="loading-spinner small"></div>` +
          `Summarizing from Wikidata…</div>`;
        try {
          const data = await fetchArticle(item);
          if (!state.current || state.current.artwork_id !== item.artwork_id) return;
          renderArticle(item, data.article);
          loadEnrichment(item, data.article); // progressive: append richer context
        } catch (e) {
          el.innerHTML = ""; // article is a nice-to-have; stay quiet on failure
        }
      }

      // Progressive enrichment: fetch the heavier layers (Wikipedia overview,
      // other works, exhibitions, period/place) and append them below the base
      // article. Fails quiet — the base article already stands on its own.
      async function loadEnrichment(item, baseArticle) {
        const slot = document.getElementById("aotd-enrich");
        if (!slot) return;
        slot.innerHTML =
          `<div class="mini-loading"><div class="loading-spinner small"></div>` +
          `Gathering more context…</div>`;
        try {
          let data = state.enrichCache[item.artwork_id];
          if (!data) {
            const url =
              `/artwork-enrichment?artwork=${encodeURIComponent(item.artwork_id)}` +
              `&artist=${encodeURIComponent(item.creator_id)}`;
            const res = await fetch(url);
            data = await res.json();
            if (!res.ok || data.status === "error") throw new Error(data.message || "no enrichment");
            state.enrichCache[item.artwork_id] = data;
          }
          if (!state.current || state.current.artwork_id !== item.artwork_id) return;
          renderEnrichment(slot, data.enrichment, baseArticle);
        } catch (e) {
          slot.innerHTML = ""; // optional extra; stay quiet on failure
        }
      }

      function renderEnrichment(slot, enr, baseArticle) {
        const sections = (enr && enr.sections) || [];
        if (!sections.length) {
          slot.innerHTML = "";
          return;
        }
        // Link entities from BOTH the base article and the enrichment (e.g. the
        // "other works" titles), longest label first, first occurrence each.
        const entities = ((baseArticle && baseArticle.entities) || [])
          .concat((enr && enr.entities) || [])
          .slice()
          .sort((a, b) => (b.label || "").length - (a.label || "").length);
        const linked = new Set();
        const body = sections
          .map((s) => {
            const h = s.heading ? `<h4 class="aotd-sec">${esc(s.heading)}</h4>` : "";
            const paras = (s.paragraphs || [])
              .map((p) => `<p>${linkifyText(p, entities, linked)}</p>`)
              .join("");
            return h + paras;
          })
          .join("");
        const sources = (enr.sources || [])
          .map(
            (s) =>
              `<a class="wd-link" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`
          )
          .join(" · ");
        const links = (enr.links || [])
          .map(
            (l) =>
              `<a class="wd-link" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`
          )
          .join(" · ");
        const explore = links
          ? `<p class="aotd-sources"><strong>Explore further:</strong> ${links}</p>`
          : "";
        const credit = sources
          ? `<p class="aotd-sources">Sources: ${sources} <span class="src-note">(Wikipedia text: CC BY-SA)</span></p>`
          : "";
        // Data provenance: the catalogues Wikidata's statements are cited from.
        const prov = (enr.provenance || []).map((p) => esc(p)).join(" · ");
        const provenance = prov
          ? `<p class="aotd-sources"><strong>Record cited from:</strong> ${prov}</p>`
          : "";
        slot.innerHTML = body + explore + provenance + credit;
      }

      // Wrap known entity labels in the text with links to Wikidata. Uses plain
      // string search (no regex on user text), whole-word boundaries, links the
      // first occurrence of each entity once (tracked in `linked`), and escapes
      // everything so the output is HTML-safe.
      function linkifyText(text, entities, linked) {
        if (!entities || !entities.length) return esc(text);
        const lower = text.toLowerCase();
        const matches = [];
        for (const e of entities) {
          if (!e.qid || linked.has(e.qid)) continue;
          const needle = (e.label || "").toLowerCase();
          if (!needle) continue;
          let from = 0,
            idx;
          while ((idx = lower.indexOf(needle, from)) !== -1) {
            const end = idx + needle.length;
            const before = idx === 0 ? " " : text[idx - 1];
            const after = end >= text.length ? " " : text[end];
            const wholeWord = !/[A-Za-z0-9]/.test(before) && !/[A-Za-z0-9]/.test(after);
            const overlaps = matches.some((m) => idx < m.end && end > m.start);
            if (wholeWord && !overlaps) {
              matches.push({ start: idx, end: end, qid: e.qid, open: e.open });
              linked.add(e.qid);
              break; // first occurrence of this entity only
            }
            from = idx + 1;
          }
        }
        if (!matches.length) return esc(text);
        matches.sort((a, b) => a.start - b.start);
        let out = "",
          pos = 0;
        for (const m of matches) {
          out += esc(text.slice(pos, m.start));
          const inner = esc(text.slice(m.start, m.end));
          if (m.open === "artwork" || m.open === "artist") {
            // In-app explore link: open that painting / that artist's work.
            out +=
              `<a class="explore-link" role="button" tabindex="0" ` +
              `data-open="${m.open}" data-qid="${esc(m.qid)}" ` +
              `title="Open ${m.open === "artwork" ? "this painting" : "this artist"}">` +
              inner +
              `</a>`;
          } else {
            out +=
              `<a class="wd-link" href="https://www.wikidata.org/wiki/${esc(m.qid)}" target="_blank" rel="noopener">` +
              inner +
              `</a>`;
          }
          pos = m.end;
        }
        out += esc(text.slice(pos));
        return out;
      }

      function renderArticle(item, article) {
        const el = document.getElementById("aotd-about");
        // Prefer sectioned format; fall back to a flat paragraphs payload (older
        // cached responses) so a format change never renders blank.
        const sections =
          (article && article.sections) ||
          (article && article.paragraphs ? [{ heading: "", paragraphs: article.paragraphs }] : []);
        if (!el || !sections.length) {
          if (el) el.innerHTML = "";
          return;
        }
        const tag =
          `<span class="about-tag" title="Assembled directly from Wikidata — no AI used">📋 From Wikidata</span>`;
        // Link known Wikidata entities (proper nouns from the dossier) in the
        // prose — first occurrence each, shared across the whole post.
        const entities = (article.entities || [])
          .slice()
          .sort((a, b) => (b.label || "").length - (a.label || "").length);
        const linked = new Set();
        const body = sections
          .map((s) => {
            const h = s.heading ? `<h4 class="aotd-sec">${esc(s.heading)}</h4>` : "";
            const paras = (s.paragraphs || [])
              .map((p) => `<p>${linkifyText(p, entities, linked)}</p>`)
              .join("");
            return h + paras;
          })
          .join("");
        el.innerHTML =
          `<h3><i class="fas fa-feather"></i> About ${tag}</h3>${body}` +
          `<div id="aotd-enrich"></div>`;
      }

      function prefetchNext() {
        if (state.items.length < 2) return;
        const next = state.items[(state.index + 1) % state.items.length];
        if (!state.cache[next.artwork_id]) loadDetails(next).catch(() => {});
      }

      function navigate(delta) {
        const n = state.items.length;
        if (!n) return;
        state.index = (state.index + delta + n) % n;
        state.stack = []; // arrows return you to the daily reel
        state.current = state.items[state.index];
        updateControls();
        showCurrent();
      }

      // ---- Explore: open any artwork / artist as the active view -------------
      function exploreLoading(label) {
        document.getElementById("content").innerHTML =
          `<div class="loading-container"><div class="loading-spinner"></div>` +
          `<div class="loading-text">Opening ${esc(label || "artwork")}…</div></div>`;
      }

      async function openExplore(kind, qid, label) {
        if (!qid) return;
        const prev = state.current;
        exploreLoading(label);
        try {
          const res = await fetch(`/resolve?${kind}=${encodeURIComponent(qid)}`);
          const data = await res.json();
          if (!res.ok || data.status === "error") throw new Error(data.message || "not found");
          if (prev) state.stack.push(prev);
          state.current = data.item;
          updateControls();
          showCurrent();
        } catch (e) {
          // Couldn't open (e.g. no image) — restore the previous view, note it.
          state.current = prev;
          showCurrent();
          toast(e.message === "Nothing displayable found"
            ? "No image available for that one."
            : "Couldn't open that — try another.");
        }
      }

      function goBack() {
        if (!state.stack.length) return;
        state.current = state.stack.pop();
        updateControls();
        showCurrent();
      }

      async function surpriseMe() {
        const prev = state.current;
        exploreLoading("a surprise");
        try {
          const res = await fetch("/surprise");
          const data = await res.json();
          if (!res.ok || data.status === "error") throw new Error(data.message || "no luck");
          if (prev) state.stack.push(prev);
          state.current = data.item;
          updateControls();
          showCurrent();
        } catch (e) {
          state.current = prev;
          showCurrent();
          toast("Couldn't find one — try again.");
        }
      }

      async function pickDate(month, day) {
        showLoading("Finding artwork for that date…");
        try {
          const res = await fetch(`/artwork-of-the-day?month=${month}&day=${day}`);
          const data = await res.json();
          if (!res.ok || data.status === "error") throw new Error(data.message || "no artwork");
          state.occasion = data.occasion;
          state.today = data.today;
          state.items = data.items || [];
          state.index = 0;
          state.stack = [];
          if (!state.items.length) throw new Error("No artwork found for that date");
          state.current = state.items[0];
          updateControls();
          showCurrent();
        } catch (e) {
          toast(e.message || "No artwork for that date.");
          showCurrent();
        }
      }

      // Tiny transient toast for soft failures.
      function toast(msg) {
        let t = document.getElementById("aotd-toast");
        if (!t) {
          t = document.createElement("div");
          t.id = "aotd-toast";
          t.className = "aotd-toast";
          document.body.appendChild(t);
        }
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove("show"), 2600);
      }

      // Show/hide the Back button and reflect whether we're off the daily reel.
      function updateControls() {
        const back = document.getElementById("btn-back");
        if (back) back.style.display = state.stack.length ? "inline-flex" : "none";
      }

      // ---- Render the current artwork ---------------------------------------
      async function showCurrent() {
        const item = state.current || state.items[state.index];
        if (!item) return;
        // On the daily reel (not exploring), arrows cycle the 30; while exploring,
        // a single item with a Back button instead.
        const onReel = !state.stack.length && state.items.length > 1;
        const multi = onReel;

        // Advertise this artwork's Linked Art record for machine discovery.
        const laAlt = document.getElementById("la-alt");
        if (laAlt) laAlt.href = "/object/" + item.artwork_id;

        document.getElementById("content").innerHTML = `
          <div class="artwork">
            <div class="img-container">
              <img src="${esc(item.image)}" class="artwork-image" alt="Painting of the day"/>
              ${
                multi
                  ? `<button class="nav-arrow prev" aria-label="Previous artwork">&#10094;</button>
                     <button class="nav-arrow next" aria-label="Next artwork">&#10095;</button>`
                  : ""
              }
              <div class="enlarge"><i class="fas fa-expand"></i></div>
              ${
                commonsFilePage(item.image)
                  ? `<a class="img-credit" href="${esc(commonsFilePage(item.image))}" target="_blank" rel="noopener" title="Image author &amp; license on Wikimedia Commons" onclick="event.stopPropagation()">&#9432; source &amp; license</a>`
                  : ""
              }
            </div>
            <div class="artwork-info">
              <h2 id="aotd-title">Loading…</h2>
              <div class="aotd-byline" id="aotd-byline"></div>
              <div class="aotd-about" id="aotd-about"></div>
              <div class="info-grid">
                <div class="artist-section" id="aotd-artist">
                  <div class="mini-loading"><div class="loading-spinner small"></div>Loading artist…</div>
                </div>
                <div class="artwork-section" id="aotd-artwork">
                  <div class="mini-loading"><div class="loading-spinner small"></div>Loading details…</div>
                </div>
              </div>
            </div>
          </div>`;

        const imgC = document.querySelector(".img-container");
        if (imgC) imgC.addEventListener("click", () => openLightbox(item));
        const prev = document.querySelector(".nav-arrow.prev");
        const next = document.querySelector(".nav-arrow.next");
        if (prev)
          prev.addEventListener("click", (e) => {
            e.stopPropagation();
            navigate(-1);
          });
        if (next)
          next.addEventListener("click", (e) => {
            e.stopPropagation();
            navigate(1);
          });

        updateBanner(item, null);

        loadArticle(item);

        try {
          const details = await loadDetails(item);
          // Guard against a fast click changing the index mid-fetch.
          if (!state.current || state.current.artwork_id !== item.artwork_id) return;
          fillDetails(details);
          updateBanner(item, details.artist);
          prefetchNext();
        } catch (e) {
          const el = document.getElementById("aotd-artwork");
          if (el)
            el.innerHTML = `<div class="mini-loading">Couldn't load details${
              state.items.length > 1 ? " — try the arrows for another." : "."
            }</div>`;
          document.getElementById("aotd-artist").innerHTML = "";
          document.getElementById("aotd-title").textContent = "Details unavailable";
        }
      }

      function fillDetails(details) {
        const artwork = details.artwork || {};
        const artist = details.artist || {};
        document.getElementById("aotd-title").textContent = artwork.title || "Untitled";
        // Prominent byline: by <Artist> (birth–death) · <date>
        const name =
          artist.name && artist.name !== "Unknown artist" ? artist.name : "";
        const yr = (s) => {
          const m = (s || "").match(/\d{4}/);
          return m ? m[0] : "";
        };
        const b = yr(artist.birthdate),
          d = yr(artist.deathdate);
        const life = b ? ` (${b}${d ? "–" + d : ""})` : "";
        const date =
          artwork.creationDate && artwork.creationDate !== "Unknown"
            ? ` · ${esc(artwork.creationDate)}`
            : "";
        document.getElementById("aotd-byline").innerHTML = name
          ? `by <span class="artist-name">${esc(name)}</span>${life}${date}`
          : "";
        document.getElementById("aotd-artist").innerHTML = artistSectionHTML(artist);
        document.getElementById("aotd-artwork").innerHTML = artworkSectionHTML(artwork);
        updateMeta(artwork, artist, name);
      }

      // SEO/social: per-artwork page title, Open Graph / Twitter tags (so a
      // shared link previews the actual painting), descriptive image alt text,
      // and a schema.org/VisualArtwork JSON-LD block.
      function updateMeta(artwork, artist, name) {
        const title = artwork.title || "Untitled";
        const img = state.current && state.current.image;
        const imgEl = document.querySelector(".artwork-image");
        if (imgEl) imgEl.alt = name ? `${title}, by ${name}` : title;

        const dated =
          artwork.creationDate && artwork.creationDate !== "Unknown"
            ? ` (${artwork.creationDate})`
            : "";
        const pageTitle = (name ? `${title} — ${name}` : title) + " · Meta History Book";
        const desc = `${title}${name ? " by " + name : ""}${dated} — a painting of the day, drawn live from Wikidata.`;
        document.title = pageTitle;
        const set = (id, attr, val) => {
          const el = document.getElementById(id);
          if (el) el.setAttribute(attr, val);
        };
        set("og-title", "content", pageTitle);
        set("tw-title", "content", pageTitle);
        set("og-desc", "content", desc);
        set("tw-desc", "content", desc);
        if (img) {
          set("og-image", "content", img);
          set("tw-image", "content", img);
        }

        const schema = { "@context": "https://schema.org", "@type": "VisualArtwork", name: title };
        if (name) schema.creator = { "@type": "Person", name };
        if (img) schema.image = img;
        if (dated) schema.dateCreated = artwork.creationDate;
        if (artwork.medium && artwork.medium !== "Unknown") schema.artMedium = artwork.medium;
        const s = document.getElementById("schema-artwork");
        if (s) s.textContent = JSON.stringify(schema);
      }

      function updateBanner(item, artist) {
        const el = document.getElementById("occasion");
        if (!el) return;
        const icon = ICONS[state.occasion] || "🗓️";
        let text;
        if (state.occasion === "birthday") {
          const name = artist && artist.name ? ` — ${artist.name}` : "";
          text = "Born on this day" + name + (item.birthYear ? ` (${item.birthYear})` : "");
        } else {
          text = `Today's pick for ${state.today}`;
        }
        const counter =
          state.items.length > 1
            ? ` &middot; ${state.index + 1} of ${state.items.length}`
            : "";
        el.innerHTML = `${icon} ${esc(text)}
          <span class="occasion-sub">${esc(state.today)}${counter}</span>`;
        el.style.display = "block";
      }

      // Related-entity chips that link out to Wikidata (Phase 2 depth).
      function chipRow(label, items) {
        if (!items || !items.length) return "";
        const chips = items
          .map(
            (e) =>
              `<a class="wd-chip" href="https://www.wikidata.org/wiki/${esc(e.qid)}" target="_blank" rel="noopener">${esc(e.label)}</a>`
          )
          .join("");
        return `<p class="chip-row"><strong>${label}:</strong> ${chips}</p>`;
      }

      function artistSectionHTML(artist) {
        const row = (label, value) =>
          value ? `<p><strong>${label}:</strong> ${esc(value)}</p>` : "";
        const born =
          (artist.birthdate || "") +
          (artist.birthplace ? ` &middot; ${esc(artist.birthplace)}` : "");
        const died = artist.deathdate
          ? `<p><strong>Died:</strong> ${esc(artist.deathdate)}${
              artist.deathplace ? ` &middot; ${esc(artist.deathplace)}` : ""
            }</p>`
          : "";
        return `
          <h3><i class="fas fa-user-circle"></i> Artist Information</h3>
          <p><strong>Name:</strong> ${esc(artist.name || "Unknown")}</p>
          ${artist.description ? `<p class="artist-desc">${esc(artist.description)}</p>` : ""}
          ${
            artist.image
              ? `<img src="${esc(artist.image)}" alt="${esc(artist.name)}" class="artist-image"/>`
              : ""
          }
          ${artist.birthdate ? `<p><strong>Born:</strong> ${born}</p>` : ""}
          ${died}
          ${row("Nationality", artist.nationality)}
          ${row("Art Movement", artist.movement)}
          ${row("Occupation", artist.occupation)}
          ${row("Teachers", artist.teachers)}
          ${row("Notable Students", artist.students)}
          ${row("Notable Works", artist.notableWorks)}
          ${chipRow("Influenced by", artist.influencedBy)}
          ${chipRow("Contemporaries", artist.contemporaries)}
          ${
            artist.wikipedia
              ? `<p><a href="${esc(artist.wikipedia)}" target="_blank" rel="noopener">
                   <i class="fab fa-wikipedia-w"></i> Read on Wikipedia</a></p>`
              : ""
          }`;
      }

      function artworkSectionHTML(artwork) {
        const row = (label, value) =>
          value ? `<p><strong>${label}:</strong> ${esc(value)}</p>` : "";
        return `
          <h3><i class="fas fa-palette"></i> Artwork Details</h3>
          ${row("Creation Date", artwork.creationDate)}
          ${row("Medium", artwork.medium)}
          ${chipRow("Depicts", artwork.depicts)}
          ${row("Current Location", artwork.location)}
          ${chipRow("In collection", artwork.collection)}
          ${row("Dimensions", artwork.dimensions)}
          ${row("Genre", artwork.genre)}`;
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && state.stack.length) return goBack();
        if (!state.items.length) return;
        if (e.key === "ArrowLeft") navigate(-1);
        else if (e.key === "ArrowRight") navigate(1);
      });

      // Delegated handler: in-app explore links inside the article prose.
      document.addEventListener("click", (e) => {
        const link = e.target.closest("[data-open]");
        if (!link) return;
        e.preventDefault();
        openExplore(link.getAttribute("data-open"), link.getAttribute("data-qid"), link.textContent);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const link = e.target.closest && e.target.closest("[data-open]");
        if (!link) return;
        e.preventDefault();
        openExplore(link.getAttribute("data-open"), link.getAttribute("data-qid"), link.textContent);
      });

      // --- Deep-zoom lightbox (IIIF manifest + OpenSeadragon) ----------------
      const OSD_BASE = "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/";
      let _osdViewer = null;

      function loadOSD() {
        return new Promise((resolve, reject) => {
          if (window.OpenSeadragon) return resolve();
          const s = document.createElement("script");
          s.src = OSD_BASE + "openseadragon.min.js";
          s.onload = () => resolve();
          s.onerror = () => reject(new Error("OpenSeadragon failed to load"));
          document.head.appendChild(s);
        });
      }

      function ensureLightbox() {
        let lb = document.getElementById("lightbox");
        if (lb) return lb;
        lb = document.createElement("div");
        lb.id = "lightbox";
        lb.innerHTML = `
          <div class="lb-bar">
            <span class="lb-title"></span>
            <span class="lb-hint">Scroll or pinch to zoom · drag to pan · Esc to close</span>
            <button class="lb-close" aria-label="Close deep-zoom view">&times;</button>
          </div>
          <div id="osd"></div>
          <div class="lb-loading">Loading high-resolution image…</div>`;
        document.body.appendChild(lb);
        lb.querySelector(".lb-close").addEventListener("click", closeLightbox);
        lb.addEventListener("click", (e) => {
          if (e.target === lb) closeLightbox();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeLightbox();
        });
        return lb;
      }

      async function openLightbox(item) {
        const lb = ensureLightbox();
        lb.classList.add("open");
        document.body.style.overflow = "hidden";
        const titleEl = document.getElementById("aotd-title");
        lb.querySelector(".lb-title").textContent = (titleEl && titleEl.textContent) || "";
        const loading = lb.querySelector(".lb-loading");
        loading.style.display = "";

        // Prefer the full-resolution image from our own IIIF manifest; fall back
        // to the displayed image if the manifest (or its Commons lookup) fails.
        let imageUrl = item.image;
        try {
          const r = await fetch("/iiif/" + item.artwork_id + "/manifest.json");
          if (r.ok) {
            const man = await r.json();
            const body =
              man.items && man.items[0].items[0].items[0] && man.items[0].items[0].items[0].body;
            if (body && body.id) imageUrl = body.id;
          }
        } catch (e) {
          /* use the displayed image */
        }

        try {
          await loadOSD();
        } catch (e) {
          closeLightbox();
          window.open(imageUrl, "_blank"); // CDN blocked — degrade to a new tab
          return;
        }
        if (_osdViewer) {
          _osdViewer.destroy();
          _osdViewer = null;
        }
        _osdViewer = OpenSeadragon({
          id: "osd",
          tileSources: { type: "image", url: imageUrl },
          prefixUrl: OSD_BASE + "images/",
          showNavigator: true,
          navigatorPosition: "BOTTOM_RIGHT",
          gestureSettingsMouse: { clickToZoom: false },
        });
        _osdViewer.addOnceHandler("open", () => {
          loading.style.display = "none";
        });
      }

      function closeLightbox() {
        const lb = document.getElementById("lightbox");
        if (!lb) return;
        lb.classList.remove("open");
        document.body.style.overflow = "";
        if (_osdViewer) {
          _osdViewer.destroy();
          _osdViewer = null;
        }
      }

      // Wire the persistent explore toolbar (Back / Surprise / date / Today).
      function wireControls() {
        const back = document.getElementById("btn-back");
        const surprise = document.getElementById("btn-surprise");
        const today = document.getElementById("btn-today");
        const dateInput = document.getElementById("date-pick");
        if (dateInput && !dateInput.value)
          dateInput.value = new Date().toISOString().slice(0, 10); // default: today
        if (back) back.addEventListener("click", goBack);
        if (surprise) surprise.addEventListener("click", surpriseMe);
        if (today) today.addEventListener("click", fetchArtwork);

        // Gallery (dark) mode — persisted across visits.
        const themeBtn = document.getElementById("btn-theme");
        const applyTheme = (on) => {
          document.body.classList.toggle("gallery", on);
          if (themeBtn) {
            themeBtn.textContent = on ? "☀️" : "🌙";
            themeBtn.setAttribute("aria-pressed", on ? "true" : "false");
          }
        };
        applyTheme(localStorage.getItem("aotd-theme") === "gallery");
        if (themeBtn)
          themeBtn.addEventListener("click", () => {
            const on = !document.body.classList.contains("gallery");
            localStorage.setItem("aotd-theme", on ? "gallery" : "light");
            applyTheme(on);
          });
        if (dateInput) {
          // Fire on BOTH input and change: some browsers (and keyboard/calendar
          // interactions) only emit one of them. Guard so we fetch once per date.
          let lastMD = "";
          const onDate = () => {
            const v = dateInput.value; // YYYY-MM-DD
            const md = v ? v.slice(5) : ""; // MM-DD
            if (!md || md === lastMD) return;
            lastMD = md;
            pickDate(parseInt(md.slice(0, 2), 10), parseInt(md.slice(3, 5), 10));
          };
          dateInput.addEventListener("change", onDate);
          dateInput.addEventListener("input", onDate);
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        wireControls();
        fetchArtwork();
      });
    </script>

    <!-- Add Bootstrap JS dependencies -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  </body>
</html>
